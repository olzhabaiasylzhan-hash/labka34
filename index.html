<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#1b1740;--mut:#6b6890;--line:#e6e2fb;--pri:#6c3cf0;--pri2:#ff7a3d;--yel:#ffc928;--ok:#12a566;--okb:#dcf6ea;--okbd:#a8e6c8;--bad:#e5384f;--badb:#fde3e7;--badbd:#f7b4bf;--sh:0 10px 30px rgba(60,30,160,.12);--box:#faf9ff;--boxy:#fff8dc;--boxyb:#ffe08a;--boxo:#fff0e8;--boxob:#ffc9ad;--thbg:#efeaff;--aib:#f3efff;--inp:#fff;--navbg:rgba(255,255,255,.95);--chip:#efeaff;--qok:#f2fcf7;--qno:#fff6f7;--hov:#f3efff;color-scheme:light}
[data-theme=dark]{--bg:#13112a;--card:#1f1c3d;--ink:#ece8ff;--mut:#a7a2cf;--line:#38326a;--pri:#9a78ff;--okb:#12382a;--okbd:#1f6b4d;--ok:#44d49a;--badb:#42202a;--badbd:#7d3040;--bad:#ff6b80;--sh:0 10px 30px rgba(0,0,0,.45);--box:#272350;--boxy:#3b3416;--boxyb:#6b5a1c;--boxo:#3d2a1f;--boxob:#7a4a30;--thbg:#2c2860;--aib:#2a2558;--inp:#171534;--navbg:rgba(31,28,61,.95);--chip:#2c2860;--qok:#133226;--qno:#3a1c25;--hov:#2a2558;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background .25s,color .25s}
.mono{font-family:'JetBrains Mono',monospace}
#top{position:sticky;top:0;z-index:40;background:var(--navbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#tb{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
#tb .sp{flex:1}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);font:800 .82rem Nunito;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.tbb{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 .85rem Nunito;border-radius:12px;padding:6px 12px;cursor:pointer}
.tbb:hover{border-color:var(--pri)}.tbb.on{background:var(--yel);color:#1b1740;border-color:#e6a800}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:800;font-size:.82rem;padding:6px 12px;border-radius:99px;background:var(--chip)}
nav a:hover{background:var(--pri);color:#fff}
.hero{background:radial-gradient(700px 400px at 90% 0,rgba(255,201,40,.45),transparent 60%),radial-gradient(600px 400px at 0 100%,rgba(255,122,61,.5),transparent 60%),linear-gradient(135deg,#2a1670,#5b2fe0);color:#fff;padding:40px 18px 56px;position:relative;overflow:hidden}
.hero .w{max-width:1100px;margin:auto;position:relative;z-index:2}
.tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 12px;border-radius:99px;font-weight:700;font-size:.8rem;margin:0 6px 6px 0}
.hero h1{font-size:clamp(1.8rem,4.5vw,3.2rem);line-height:1.1;margin:14px 0 8px;font-weight:900}
.hero h1 em{font-style:normal;color:var(--yel)}
.hero p{max-width:720px;opacity:.92}
.bolt{position:absolute;right:4%;top:12%;font-size:11rem;opacity:.13;transform:rotate(12deg);z-index:1}
main{max-width:1100px;margin:0 auto;padding:18px 14px 120px}
section.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px;margin:22px 0;scroll-margin-top:110px}
h2{margin:0 0 14px;font-size:1.45rem;display:flex;align-items:center;gap:10px}
h2 .n{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:12px;min-width:36px;height:36px;display:grid;place-items:center;font-size:1rem;padding:0 6px;flex:none}
h3{margin:16px 0 6px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.box{border-radius:16px;padding:14px 16px;border:2px solid var(--line);background:var(--box)}
.box.y{background:var(--boxy);border-color:var(--boxyb)}.box.o{background:var(--boxo);border-color:var(--boxob)}.box.g{background:var(--okb);border-color:var(--okbd)}.box.r{background:var(--badb);border-color:var(--badbd)}
.box h4{margin:0 0 6px}
ul,ol{margin:6px 0;padding-left:22px}li{margin:3px 0}
.fm{background:#1b1740;color:#fff;border-radius:14px;padding:12px 16px;margin:8px 0;font-size:1.15rem;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.fm b{color:var(--yel)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .25em;font-size:.95em}.fr i{font-style:normal;padding:0 .3em}.fr i:first-child{border-bottom:1.5px solid currentColor}
figure{margin:0;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column}
figure .im{aspect-ratio:4/3;background:linear-gradient(135deg,#ece6ff,#fff4e6);display:grid;place-items:center;overflow:hidden}
figure img{width:100%;height:100%;object-fit:cover}figure .im svg{width:78%;height:78%}
figcaption{padding:10px 12px;font-size:.9rem}figcaption b{font-size:1rem;display:block}
figcaption a{font-size:.78rem;font-weight:800;color:var(--pri)}
.btn{border:0;cursor:pointer;font:800 .95rem Nunito;border-radius:12px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,var(--pri),#8a5cff);box-shadow:0 4px 0 #4a24b8;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a24b8}
.btn.o{background:linear-gradient(135deg,var(--pri2),#ffa02e);box-shadow:0 4px 0 #c2501b}
.btn.s{background:var(--chip);color:var(--pri);box-shadow:0 3px 0 var(--line);padding:7px 12px}
input[type=text],input[type=number],input[type=date],textarea,select{font:700 1rem Nunito;border:2px solid var(--line);border-radius:10px;padding:7px 10px;width:120px;background:var(--inp);color:var(--ink)}
textarea{width:100%;min-height:70px}input:focus,textarea:focus{outline:0;border-color:var(--pri)}
.fb{margin-top:10px}.vd{display:inline-block;font-weight:900;padding:4px 12px;border-radius:99px}.vd.good{background:var(--okb);color:var(--ok)}.vd.bad{background:var(--badb);color:var(--bad)}
.aib{margin-top:8px;background:var(--aib);border-left:5px solid var(--pri);border-radius:10px;padding:10px 12px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.meter{background:linear-gradient(#3a3a46,#1f1f27);border-radius:14px;padding:10px;display:inline-block;box-shadow:0 8px 18px rgba(0,0,0,.3);width:280px;max-width:100%}
.meter svg{display:block;width:100%;border-radius:8px}
table{border-collapse:collapse;width:100%}th,td{border:2px solid var(--line);padding:6px;text-align:center}th{background:var(--thbg);font-size:.85rem}td input{width:90px}
.scroll{overflow-x:auto}
.stu{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.stu label{font-weight:800;font-size:.9rem;display:block}.stu input{width:100%;margin-top:4px}
@media(max-width:640px){.stu{grid-template-columns:1fr}}
#lab{width:100%;border-radius:18px;border:4px solid #b9ad8c;touch-action:none;user-select:none;-webkit-user-select:none;background:#d8d0bb}
#lab .dev{cursor:grab}#lab .dev:active{cursor:grabbing}
.term{cursor:pointer}.term:hover circle:first-child{stroke:#ff7a3d;stroke-width:4}
.wire{cursor:pointer;pointer-events:stroke}.hint{font-size:.85rem;color:var(--mut)}
.pill{padding:5px 12px;border-radius:99px;border:2px solid var(--line);cursor:pointer;font-weight:800;background:var(--card);color:var(--ink)}.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.q{padding:12px;border:2px solid var(--line);border-radius:14px;margin:10px 0}.q label{display:block;padding:4px 8px;border-radius:8px;cursor:pointer}.q label:hover{background:var(--hov)}
.q.ok{border-color:var(--okbd);background:var(--qok)}.q.no{border-color:var(--badbd);background:var(--qno)}
.app{display:inline-block;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:4px;cursor:pointer;text-align:center;background:var(--card);user-select:none;min-width:118px}
.app.on{background:var(--yel);border-color:#e6a800;color:#1b1740;transform:translateY(-2px)}.app.on .hint{color:#4b4520}.app .e{font-size:2rem}
#trip{display:none;background:var(--bad);color:#fff;font-weight:900;padding:10px;border-radius:12px;margin:8px 0}
.simsvg{width:100%;max-width:760px;display:block;border-radius:16px;border:2px solid var(--line);background:linear-gradient(#f3efe2,#e6dfc9)}
.simsvg text{font-family:Nunito,sans-serif}
.fl{stroke:#ff7a3d;stroke-width:5;stroke-dasharray:10 8;animation:fw 1s linear infinite}.dead{stroke:#9a97b8;stroke-width:5}
@keyframes fw{to{stroke-dashoffset:-18}}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--box)}
.chk input{width:22px;height:22px;accent-color:var(--pri);flex:none;margin-top:3px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0;transition:.3s}
.pr th{width:32%;text-align:left}.pr td{text-align:left}.pr td textarea,.pr td input{width:100%}
.sen-only{display:none}body.sen .sen-only{display:revert}.hid{display:none!important}
.stp{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0;font-weight:800;font-size:1.1rem}
.stp .no{background:var(--pri);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
body.sen{font-size:1.2rem;letter-spacing:.015em;line-height:1.9}
body.sen .btn{font-size:1.1rem;padding:14px 22px}body.sen input,body.sen textarea,body.sen select{font-size:1.1rem}
body.sen .sen-hide{display:none!important}body.sen *{animation:none!important;scroll-behavior:auto}
body.sen section.card{border:3px solid var(--line)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:800;z-index:99;display:none;max-width:90vw}
#barsik{position:fixed;right:14px;bottom:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#bb{width:92px;height:92px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(60,30,160,.35);cursor:pointer;padding:0;border:3px solid var(--yel)}
#bb:hover{transform:scale(1.07) rotate(-4deg)}#bb svg{width:100%;height:100%}
.tail{transform-origin:70px 88px;animation:wag 1.4s ease-in-out infinite}@keyframes wag{50%{transform:rotate(18deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#bsay{background:var(--card);border-radius:14px 14px 4px 14px;padding:8px 12px;font-weight:800;font-size:.85rem;box-shadow:var(--sh);max-width:210px}
#bp{display:none;width:min(360px,calc(100vw - 28px));height:min(470px,70vh);background:var(--card);border-radius:20px;box-shadow:0 14px 40px rgba(40,20,120,.35);flex-direction:column;overflow:hidden;border:2px solid var(--pri)}
#bp header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:10px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
#bm{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--box)}
.m{padding:8px 12px;border-radius:14px;max-width:86%;font-size:.93rem;white-space:pre-wrap}.m.b{background:var(--aib);align-self:flex-start}.m.u{background:var(--pri);color:#fff;align-self:flex-end}
#bf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}#bf input{flex:1;width:auto}
#bch{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);max-height:96px;overflow:auto}
#bch button{border:2px solid var(--line);background:var(--chip);color:var(--pri);font:800 .75rem Nunito;border-radius:99px;padding:4px 10px;cursor:pointer}
#bch button:hover{border-color:var(--pri)}
footer{text-align:center;color:var(--mut);padding:20px;font-size:.85rem}
@media print{
 #top,#barsik,.btn,.tbb,#toast,.noprint,nav{display:none!important}
 body{background:#fff;font-size:11pt}
 section.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;margin:10px 0;padding:14px}
 .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:20px 18px}.bolt{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 input,textarea{border:1px solid #888!important}
 main{padding:0}
}
</style>

sen_w:[`<b>Есіңде болсын:</b><br>🔹 Параллель = қатар.<br>🔹 Амперметр токты өлшейді. Ол тізбекке <b>тізбектей</b> қосылады.<br>🔹 Вольтметр кернеуді өлшейді. Ол резисторға <b>параллель</b> қосылады.`,`<b>Запомни:</b><br>🔹 Параллельно = рядом.<br>🔹 Амперметр измеряет ток. Он включается <b>последовательно</b>.<br>🔹 Вольтметр измеряет напряжение. Он включается <b>параллельно</b> резистору.`,`<b>Remember:</b><br>🔹 Parallel = side by side.<br>🔹 The ammeter measures current. It is connected <b>in series</b>.<br>🔹 The voltmeter measures voltage. It is connected <b>in parallel</b> with the resistor.`],

/* 1 */
s1_h2:[`Жұмыс туралы`,`О работе`,`About the work`],
s1_q:[`<h4>❓ Зерттеу сұрағы</h4>Өткізгіштерді параллель жалғаған кезде тізбектегі жалпы ток күші, кернеу және жалпы кедергі қалай өзгереді?`,`<h4>❓ Исследовательский вопрос</h4>Как изменяются общая сила тока, напряжение и общее сопротивление цепи при параллельном соединении проводников?`,`<h4>❓ Research question</h4>How do the total current, the voltage and the total resistance of a circuit change when conductors are connected in parallel?`],
s1_g:[`<h4>🎯 Мақсат</h4>Өткізгіштерді параллель жалғау заңдылықтарын тәжірибе жүзінде анықтау және электр шамаларын өлшеу арқылы тексеру.`,`<h4>🎯 Цель</h4>Опытным путём установить закономерности параллельного соединения проводников и проверить их измерением электрических величин.`,`<h4>🎯 Aim</h4>To find the laws of the parallel connection of conductors by experiment and to check them by measuring electrical quantities.`],
s1_o:[`<h4>📚 Оқу мақсаттары</h4><ul><li><b>8.4.2.10</b> – параллель жалғау заңдылықтарын эксперимент арқылы анықтау;</li><li><b>8.1.3.3</b> – физика кабинетінде қауіпсіздік ережелерін білу және сақтау.</li></ul>`,`<h4>📚 Цели обучения</h4><ul><li><b>8.4.2.10</b> – устанавливать закономерности параллельного соединения экспериментально;</li><li><b>8.1.3.3</b> – знать и соблюдать правила безопасности в кабинете физики.</li></ul>`,`<h4>📚 Learning objectives</h4><ul><li><b>8.4.2.10</b> – find the laws of the parallel connection by experiment;</li><li><b>8.1.3.3</b> – know and follow safety rules in the physics classroom.</li></ul>`],
s1_t:[`<h4>✅ Міндеттер</h4><ol><li>Параллель жалғау арқылы электр тізбегін құрастыру.</li><li>Әр тармақтағы ток күші мен кернеуді өлшеп, байланысын анықтау.</li><li>Жалпы кедергіні есептеп, заңдылықтарды дәлелдеу.</li></ol>`,`<h4>✅ Задачи</h4><ol><li>Собрать электрическую цепь с параллельным соединением.</li><li>Измерить силу тока и напряжение в каждой ветви и найти связь между ними.</li><li>Вычислить общее сопротивление и доказать закономерности.</li></ol>`,`<h4>✅ Tasks</h4><ol><li>Build an electric circuit with a parallel connection.</li><li>Measure the current and the voltage in each branch and find the relation.</li><li>Calculate the total resistance and prove the laws.</li></ol>`],
s1_h:[`<h4>💡 Гипотеза</h4>Егер өткізгіштерді параллель жалғасақ, әр өткізгіштің ұштарындағы кернеу бірдей, жалпы ток күші тармақтардағы ток күштерінің қосындысына тең болады. Жалпы кедергі жеке өткізгіштердің кедергілерінен аз болады.`,`<h4>💡 Гипотеза</h4>Если соединить проводники параллельно, то напряжение на концах каждого одинаково, общая сила тока равна сумме токов в ветвях, а общее сопротивление меньше сопротивления каждого проводника.`,`<h4>💡 Hypothesis</h4>If conductors are connected in parallel, the voltage across each one is the same, the total current equals the sum of the branch currents, and the total resistance is smaller than any single resistance.`],
s1_v:[`<h4>🔀 Айнымалылар</h4><b>Тәуелсіз:</b> параллель жалғанған өткізгіштер саны.<br><b>Тәуелді:</b> жалпы ток күші және жалпы кедергі.<br><b>Тұрақты:</b> ток көзінің кернеуі, материал, температура, әр өткізгіштің кедергісі.`,`<h4>🔀 Переменные</h4><b>Независимая:</b> число параллельно соединённых проводников.<br><b>Зависимая:</b> общая сила тока и общее сопротивление.<br><b>Постоянные:</b> напряжение источника, материал, температура, сопротивление каждого проводника.`,`<h4>🔀 Variables</h4><b>Independent:</b> number of conductors connected in parallel.<br><b>Dependent:</b> total current and total resistance.<br><b>Controlled:</b> source voltage, material, temperature, resistance of each conductor.`],

s2_h2:[`Құрал-жабдықтар · шынайы зертхана қалай көрінеді?`,`Оборудование · как выглядит настоящая лаборатория?`,`Equipment · what a real lab looks like`],
s2_hint:[`📷 Шынайы фотоларды <code>photos/</code> қалтасына (<code>source.jpg, resistor.jpg, lamp.jpg, ammeter.jpg, voltmeter.jpg, key.jpg, wires.jpg, rheostat.jpg</code>) салсаң, осы жерде көрінеді. Фото жоқ болса – сызба көрсетіледі.`,`📷 Если положить реальные фото в папку <code>photos/</code> (<code>source.jpg, resistor.jpg, lamp.jpg, ammeter.jpg, voltmeter.jpg, key.jpg, wires.jpg, rheostat.jpg</code>), они появятся здесь. Если фото нет – показывается схема.`,`📷 Put real photos in the <code>photos/</code> folder (<code>source.jpg, resistor.jpg, lamp.jpg, ammeter.jpg, voltmeter.jpg, key.jpg, wires.jpg, rheostat.jpg</code>) and they appear here. Without photos a drawing is shown.`],

eq_resistor_t:[`Резистор`,`Резистор`,`Resistor`],eq_resistor_d:[`Белгілі кедергісі бар өткізгіш (Ом). Түсті жолақтар кедергі мәнін көрсетеді. Тәжірибеде екі резистор алынады.`,`Проводник с известным сопротивлением (Ом). Цветные полоски показывают значение. В опыте берут два резистора.`,`A conductor with a known resistance (Ω). Colour bands show its value. Two resistors are used in the experiment.`],
eq_lamp_t:[`Электр шамы`,`Электрическая лампа`,`Electric bulb`],eq_lamp_d:[`Кедергісі бар жарық беретін өткізгіш; резистордың орнына алынады. Ток өткенде қызады.`,`Проводник, дающий свет; можно взять вместо резистора. При токе нагревается.`,`A conductor that gives light; can be used instead of a resistor. It heats up when current flows.`],
eq_ammeter_t:[`Амперметр`,`Амперметр`,`Ammeter`],eq_ammeter_d:[`Ток күшін (А) өлшейді. Тізбекке ТІЗБЕКТЕЙ жалғанады. Алдымен бөлік құнын анықта!`,`Измеряет силу тока (А). Включается в цепь ПОСЛЕДОВАТЕЛЬНО. Сначала определи цену деления!`,`Measures current (A). Connected IN SERIES. First find the scale division!`],
eq_voltmeter_t:[`Вольтметр`,`Вольтметр`,`Voltmeter`],eq_voltmeter_d:[`Кернеуді (В) өлшейді. Өлшенетін өткізгішке ПАРАЛЛЕЛЬ жалғанады.`,`Измеряет напряжение (В). Подключается ПАРАЛЛЕЛЬНО измеряемому проводнику.`,`Measures voltage (V). Connected IN PARALLEL with the conductor measured.`],
eq_key_t:[`Кілт (қосқыш)`,`Ключ (выключатель)`,`Key (switch)`],eq_key_d:[`Тізбекті қосып-өшіреді. Тізбекті құрастырған кезде кілт ашық болуы керек.`,`Замыкает и размыкает цепь. При сборке цепи ключ должен быть разомкнут.`,`Opens and closes the circuit. While building the circuit the key must be open.`],
eq_wires_t:[`Жалғағыш сымдар`,`Соединительные провода`,`Connecting wires`],eq_wires_d:[`Құралдарды байланыстырады. Оқшаулағыш қабатының зақымдалмағанын тексер.`,`Соединяют приборы. Проверь, что изоляция не повреждена.`,`Connect the devices. Check that the insulation is not damaged.`],
eq_rheostat_t:[`Реостат`,`Реостат`,`Rheostat`],eq_rheostat_d:[`Кедергіні өзгертіп, ток күшін реттейді (қажет болғанда ғана).`,`Меняет сопротивление и регулирует силу тока (при необходимости).`,`Changes resistance and regulates current (only when needed).`],
/* 3 */
s3_h2:[`Қауіпсіздік ережелері`,`Правила безопасности`,`Safety rules`],
s3_l:[`<ol><li>Тізбекті құрастыру алдында ток көзін ажырат.</li><li>Тізбекті тек мұғалімнің рұқсатымен қос.</li><li>Кернеу рұқсат етілген мәннен аспасын.</li><li>Амперметр – <b>тізбектей</b>, вольтметр – <b>параллель</b>.</li><li>Жалаңаш сымға және ток көзіне дымқыл қолмен тиме.</li><li>Сымдардың оқшаулағышы зақымданбағанын тексер.</li><li>Тәжірибе соңында ток көзін міндетті түрде ажырат.</li></ol>`,`<ol><li>Перед сборкой цепи отключи источник тока.</li><li>Включай цепь только с разрешения учителя.</li><li>Напряжение не должно превышать допустимое.</li><li>Амперметр – <b>последовательно</b>, вольтметр – <b>параллельно</b>.</li><li>Не касайся голых проводов и источника мокрыми руками.</li><li>Проверь, что изоляция проводов не повреждена.</li><li>В конце опыта обязательно отключи источник тока.</li></ol>`,`<ol><li>Disconnect the power source before building the circuit.</li><li>Switch on the circuit only with the teacher's permission.</li><li>The voltage must not exceed the allowed value.</li><li>Ammeter – <b>in series</b>, voltmeter – <b>in parallel</b>.</li><li>Do not touch bare wires or the source with wet hands.</li><li>Check that the wire insulation is not damaged.</li><li>At the end of the experiment always disconnect the source.</li></ol>`],
s3_w:[`<h4>⚠️ Есіңде болсын</h4>Амперметрді тізбекке <b>параллель</b> қоссаң – қысқа тұйықталу болады: құрал күйіп кетеді! Виртуалды зертханада да осы қатені тексереміз.`,`<h4>⚠️ Запомни</h4>Если включить амперметр <b>параллельно</b> – будет короткое замыкание: прибор сгорит! В виртуальной лаборатории мы тоже проверяем эту ошибку.`,`<h4>⚠️ Remember</h4>If you connect an ammeter <b>in parallel</b> it causes a short circuit and the device burns out! The virtual lab checks this mistake too.`],
/* 4 */
s4_h2:[`Қысқаша теория`,`Краткая теория`,`Short theory`],
s4_p:[`Параллель жалғауда өткізгіштердің басы бір түйінге, соңы екінші түйінге жалғанады, ток бірнеше тармаққа бөлінеді.`,`При параллельном соединении начала проводников присоединяют к одному узлу, а концы – к другому; ток разделяется на несколько ветвей.`,`In a parallel connection the beginnings of the conductors are joined to one node and the ends to another node; the current splits into several branches.`],
s4_n:[`Параллель жалғауда жалпы кедергі әрбір жеке өткізгіштің кедергісінен <b>аз</b> болады.`,`При параллельном соединении общее сопротивление <b>меньше</b> сопротивления каждого отдельного проводника.`,`In a parallel connection the total resistance is <b>smaller</b> than the resistance of every single conductor.`],
/* 5 */
s5_h2:[`Зертханаға дейін: құралдың бөлік құнын анықта`,`Перед лабораторной: определи цену деления прибора`,`Before the lab: find the scale division`],
s5_p:[`Өлшеу алдында шкаланың <b>бөлік құнын</b> білу керек: <b>c = (көрші екі сан арасындағы айырма) ÷ (араларындағы бөліктер саны)</b>. Төмендегі құралдарды оқы:`,`Перед измерением нужно знать <b>цену деления</b> шкалы: <b>c = (разность соседних чисел) ÷ (число делений между ними)</b>. Прочитай приборы ниже:`,`Before measuring you must know the <b>scale division value</b>: <b>c = (difference between two neighbouring numbers) ÷ (number of divisions between them)</b>. Read the meters below:`],

/* LAB */
lab_h2:[`Виртуалды зертхана: тізбекті өзің құрастыр`,`Виртуальная лаборатория: собери цепь сам`,`Virtual lab: build the circuit yourself`],
lab_how:[`<b>Қалай жұмыс істейді?</b><br>1) Құралдарды жоғарғы <u>сөрeден</u> басып ұстап, төмендегі <u>партаға</u> сүйреп әкел. Партадағы құралды қалаған жеріңе жылжыта аласың; сөреге қайтарса – алынып тасталады.<br>2) Бір құралдың ұшын (⭕ клемма) бас, содан кейін екінші құралдың клеммасын бас – сым пайда болады. Сымды өшіру үшін оны бас.<br><b>Тапсырма:</b> ток көзі, кілт, амперметр (жалпы тізбекке <u>тізбектей</u>), екі резистор (<u>параллель</u>) және вольтметр (резисторларға <u>параллель</u>) жалғап, <b>«Тізбекті тексеру»</b> батырмасын бас.`,`<b>Как это работает?</b><br>1) Нажми на прибор на верхней <u>полке</u> и перетащи его на <u>парту</u> внизу. Прибор на парте можно двигать; если вернуть на полку – он убирается.<br>2) Нажми на контакт (⭕ клемма) одного прибора, затем на клемму другого – появится провод. Чтобы убрать провод, нажми на него.<br><b>Задание:</b> соедини источник тока, ключ, амперметр (<u>последовательно</u> в общую цепь), два резистора (<u>параллельно</u>) и вольтметр (<u>параллельно</u> резисторам) и нажми <b>«Проверить цепь»</b>.`,`<b>How does it work?</b><br>1) Press and hold a device on the upper <u>shelf</u> and drag it onto the <u>desk</u> below. You can move devices on the desk; dragging one back to the shelf removes it.<br>2) Click a terminal (⭕) of one device, then a terminal of another – a wire appears. Click a wire to delete it.<br><b>Task:</b> connect the power source, key, ammeter (<u>in series</u> in the main circuit), two resistors (<u>in parallel</u>) and a voltmeter (<u>in parallel</u> with the resistors), then press <b>“Check the circuit”</b>.`],

e_open:[n=>`❗ «${n}» құралының ұшы жалғанбаған. Барлық құрал тізбекке қосылуы керек.`,n=>`❗ Контакт прибора «${n}» не подключён. Все приборы должны быть в цепи.`,n=>`❗ A terminal of the “${n}” is not connected. Every device must be in the circuit.`],
e_short:[`⚡ Қысқа тұйықталу! Ток көзінің екі полюсі сыммен тікелей жалғанған. Ток көзін дереу ажыратады!`,`⚡ Короткое замыкание! Два полюса источника соединены проводом напрямую. Источник нужно сразу отключить!`,`⚡ Short circuit! The two poles of the source are joined directly by a wire. Disconnect the source at once!`],
e_amshort:[`❗ Амперметрдің екі ұшы бір түйінде – құрал тізбекке жұмыс істемейді (қысқа тұйықталған).`,`❗ Оба контакта амперметра в одном узле – прибор в цепи не работает (замкнут накоротко).`,`❗ Both terminals of the ammeter are on one node – it does not work (short-circuited).`],
e_rshort:[`❗ Резистордың екі ұшы бір түйінде – резистор қысқа тұйықталған.`,`❗ Оба контакта резистора в одном узле – резистор замкнут накоротко.`,`❗ Both terminals of a resistor are on one node – the resistor is short-circuited.`],
e_notpar:[`❗ Резисторлар параллель емес: олардың екі ұшы да сәйкес екі түйінге жалғануы керек (екеуінің «басы» бір түйінде, «соңы» екінші түйінде).`,`❗ Резисторы не параллельны: их концы должны быть присоединены к двум общим узлам («начала» в одном узле, «концы» в другом).`,`❗ The resistors are not in parallel: their ends must go to two common nodes (both “beginnings” on one node, both “ends” on the other).`],
e_vol:[`❗ Вольтметр өткізгіштерге параллель жалғанбаған. Оның ұштарын резисторлардың ортақ түйіндеріне қос.`,`❗ Вольтметр не подключён параллельно проводникам. Присоедини его к общим узлам резисторов.`,`❗ The voltmeter is not in parallel with the conductors. Connect it to the common nodes of the resistors.`],
e_main:[`❗ Негізгі тізбек дұрыс емес: ток көзі, кілт, амперметр және резисторлар блогы бір тұйық контурда бірінен соң бірі (тізбектей) жалғануы керек. Амперметр резисторларға параллель болмауы тиіс.`,`❗ Основная цепь неверна: источник, ключ, амперметр и блок резисторов должны идти друг за другом (последовательно) в одном замкнутом контуре. Амперметр не должен быть параллелен резисторам.`,`❗ The main circuit is wrong: the source, key, ammeter and resistor block must follow each other (in series) in one closed loop. The ammeter must not be parallel to the resistors.`],

s7_ch:[`🧠 Қорытынды`,`🧠 Вывод`,`🧠 Conclusion`],s7_cp:[`R-ді R₁ және R₂-мен салыстыр. Гипотеза расталды ма? Өз сөзіңмен жаз:`,`Сравни R с R₁ и R₂. Подтвердилась ли гипотеза? Напиши своими словами:`,`Compare R with R₁ and R₂. Was the hypothesis confirmed? Write in your own words:`],

s8_h2:[`График сыз: I(U) тәуелділігі`,`Построй график: зависимость I(U)`,`Draw a graph: I(U) dependence`],
s8_p:[`Сенің тізбегіңде ток көзі өзгерсе, әр тармақтағы ток <b>I = U/R</b> заңымен өзгереді. Кестені толтыр (I = I₁+I₂), содан кейін <b>нүктелерді</b> тордың ішін басып қой: алдымен серияны таңда (I₁, I₂ немесе I).`,`Если в твоей цепи менять напряжение источника, ток в каждой ветви меняется по закону <b>I = U/R</b>. Заполни таблицу (I = I₁+I₂), затем ставь <b>точки</b> кликом по сетке: сначала выбери серию (I₁, I₂ или I).`,`If the source voltage in your circuit changes, the current in each branch changes by <b>I = U/R</b>. Fill in the table (I = I₁+I₂), then place <b>points</b> by clicking in the grid: first choose a series (I₁, I₂ or I).`],

s9_h2:[`Өмірмен байланыс: үйдегі электр желісі`,`Связь с жизнью: электросеть дома`,`Real life: the electric network at home`],
s9_p:[`Үйдегі розеткалардағы барлық құрал бір-біріне <b>параллель</b> қосылған, кернеу – 220 В. Төмендегі виртуалды үйде екі қосылуды салыстыр: <b>шамды басып</b> оны күйдір, не болатынын бақыла!`,`Все приборы в розетках дома подключены <b>параллельно</b>, напряжение – 220 В. В виртуальном доме ниже сравни два способа соединения: <b>нажми на лампу</b>, чтобы она перегорела, и наблюдай!`,`All appliances plugged into home sockets are connected <b>in parallel</b>, 220 V. In the virtual house below compare two connections: <b>click a bulb</b> to burn it out and watch what happens!`],

sim_s2:[`Бір шам күйді, бірақ қалғандары жануын жалғастырады – тармақтар бір-біріне тәуелсіз!`,`Одна лампа перегорела, но остальные горят – ветви независимы!`,`One bulb burned out but the others keep shining – the branches are independent!`],

l1_b:[`Электр шәйнек (2200 Вт) және шам (110 Вт) 220 В желіге параллель қосылған. Тармақтарда I = P/U. <b>Жалпы ток күші қанша?</b>`,`Электрочайник (2200 Вт) и лампа (110 Вт) включены параллельно в сеть 220 В. В ветвях I = P/U. <b>Чему равна общая сила тока?</b>`,`An electric kettle (2200 W) and a lamp (110 W) are connected in parallel to a 220 V mains. In each branch I = P/U. <b>What is the total current?</b>`],
l2_h:[`🚗 2-тапсырма (есеп). Көлік фарасы`,`🚗 Задание 2 (задача). Фары автомобиля`,`🚗 Task 2 (problem). Car headlights`],
l2_b:[`Көліктің екі бірдей фарасының әрқайсысының кедергісі 6 Ом, олар параллель жалғанған. <b>Жалпы кедергі қанша?</b>`,`Две одинаковые фары автомобиля сопротивлением 6 Ом каждая соединены параллельно. <b>Чему равно общее сопротивление?</b>`,`Two identical car headlights of 6 Ω each are connected in parallel. <b>What is the total resistance?</b>`],
l2_q:[`Бір фара күйіп кетсе, екіншісі не істейді?`,`Если одна фара перегорит, что будет со второй?`,`If one headlight burns out, what does the other one do?`],
l2_o0:[`таңда…`,`выбери…`,`choose…`],l2_o1:[`жануын жалғастырады`,`продолжает гореть`,`keeps shining`],l2_o2:[`да сөнеді`,`тоже гаснет`,`goes out too`],
chk_s:[`Тексеру`,`Проверить`,`Check`],
l3_h:[`🎮 3-тапсырма (ойын): «Автоматты сақтандырғышты жеңіп көр!»`,`🎮 Задание 3 (игра): «Победи автомат-предохранитель!»`,`🎮 Task 3 (game): “Beat the circuit breaker!”`],
l3_p:[`Сақтандырғыш <b>16 А</b>-ге есептелген. Құралдарды қосып, жалпы ток күшін <b>14–16 А</b> аралығына жеткіз. 16 А-ден асырсаң, автомат сөнеді! Әр құрал 220 В желіге параллель.`,`Предохранитель рассчитан на <b>16 А</b>. Включай приборы и доведи общий ток до <b>14–16 А</b>. Если превысишь 16 А – автомат выключится! Каждый прибор подключён параллельно к сети 220 В.`,`The breaker is rated for <b>16 A</b>. Switch on appliances and bring the total current to <b>14–16 A</b>. If you exceed 16 A the breaker trips! Each appliance is connected in parallel to 220 V.`],
l_trip:[`⚡ Автомат сөнді! Ток 16 А-ден асты. Қайта бастаймыз…`,`⚡ Автомат выключился! Ток превысил 16 А. Начинаем заново…`,`⚡ The breaker tripped! The current exceeded 16 A. Starting again…`],

ap0:[`Шәйнек`,`Чайник`,`Kettle`],ap1:[`Үтік`,`Утюг`,`Iron`],ap2:[`Теледидар`,`Телевизор`,`TV`],ap3:[`Микротолқынды пеш`,`Микроволновка`,`Microwave`],ap4:[`Шам`,`Лампа`,`Lamp`],ap5:[`Тоңазытқыш`,`Холодильник`,`Fridge`],
l4_h:[`✍️ Ойланып көр`,`✍️ Подумай`,`✍️ Think`],l4_q:[`Неге үйдегі құралдарды тізбектей емес, параллель жалғайды? Түсіндір.`,`Почему приборы дома подключают параллельно, а не последовательно? Объясни.`,`Why are home appliances connected in parallel and not in series? Explain.`],
f_l1:[`Әр тармақ үшін I=P/U есепте (10 А және 0,5 А), содан кейін I=I₁+I₂ қос.`,`Для каждой ветви вычисли I=P/U (10 А и 0,5 А), затем сложи: I=I₁+I₂.`,`For each branch calculate I=P/U (10 A and 0.5 A), then add: I=I₁+I₂.`],
f_l2:[`Бірдей екі кедергі параллель болса R = R₁/2. Әр тармақ тәуелсіз: бір тармақ үзілсе, екіншісінде ток жүре береді.`,`Для двух одинаковых сопротивлений R = R₁/2. Ветви независимы: если одна оборвалась, ток в другой идёт.`,`For two identical resistances in parallel R = R₁/2. Branches are independent: if one breaks, the other still carries current.`],

f_l4:[`Кернеуге және бір құрал сөнгенде қалғандарына не болатынына назар аудар.`,`Обрати внимание на напряжение и на то, что происходит с остальными, если один прибор выключен.`,`Think about the voltage and about what happens to the others when one appliance goes off.`],

b_greet:[`Сәлем! Мен Барсикпін 🐾 Тізбек, формула немесе құрал туралы сұра – бірге шешеміз!`,`Привет! Я Барсик 🐾 Спрашивай про цепь, формулы или приборы – решим вместе!`,`Hi! I'm Barsik 🐾 Ask about the circuit, formulas or devices – we'll solve it together!`],
b_gear:[`Файлды компьютерден ашқанда ЖИ жұмыс істеуі үшін Anthropic API кілтін енгіз (тек осы браузерде сақталады). Бос қалдырсаң – жергілікті жауаптар қолданылады.`,`Для работы ИИ при открытии файла на компьютере введи ключ Anthropic API (хранится только в этом браузере). Если оставить пустым – будут местные ответы.`,`To use AI when the file is opened from your computer enter an Anthropic API key (stored only in this browser). Leave empty to use built-in answers.`],
b_div:[`Бөлік құны c = (көрші екі санның айырмасы) ÷ (араларындағы бөліктер саны). Шкаладан екі санды тауып көрші, санап көр! 🐾`,`Цена деления c = (разность двух соседних чисел) ÷ (число делений между ними). Найди на шкале два числа и посчитай! 🐾`,`Division value c = (difference of two neighbouring numbers) ÷ (number of divisions between them). Find two numbers on the scale and count! 🐾`],
b_am:[`Амперметр ток күшін өлшейді және тізбекке ТІЗБЕКТЕЙ қосылады. Параллель қоссаң – қысқа тұйықталу!`,`Амперметр измеряет силу тока и включается ПОСЛЕДОВАТЕЛЬНО. Включишь параллельно – короткое замыкание!`,`The ammeter measures current and is connected IN SERIES. In parallel it causes a short circuit!`],
b_vol:[`Вольтметр кернеуді өлшейді, өлшенетін өткізгішке ПАРАЛЛЕЛЬ қосылады.`,`Вольтметр измеряет напряжение и подключается ПАРАЛЛЕЛЬНО измеряемому проводнику.`,`The voltmeter measures voltage and is connected IN PARALLEL with the conductor.`],
b_res:[`Параллель: 1/R = 1/R₁ + 1/R₂. Екеуі үшін R = R₁R₂/(R₁+R₂). Нәтиже әрдайым ең кіші кедергіден аз болады.`,`Параллельно: 1/R = 1/R₁ + 1/R₂. Для двух R = R₁R₂/(R₁+R₂). Результат всегда меньше самого малого сопротивления.`,`In parallel: 1/R = 1/R₁ + 1/R₂. For two, R = R₁R₂/(R₁+R₂). The result is always smaller than the smallest resistance.`],
b_cur:[`Параллельде кернеу бірдей: U=U₁=U₂, ал токтар қосылады: I=I₁+I₂. Ом заңы: I=U/R.`,`При параллельном соединении напряжение одинаково: U=U₁=U₂, а токи складываются: I=I₁+I₂. Закон Ома: I=U/R.`,`In parallel the voltage is the same: U=U₁=U₂ and the currents add: I=I₁+I₂. Ohm's law: I=U/R.`],
b_saf:[`Алдымен ток көзін ажырат, мұғалімнің рұқсатымен қос, дымқыл қолмен тиме!`,`Сначала отключи источник, включай с разрешения учителя, не трогай мокрыми руками!`,`First disconnect the source, switch on only with the teacher's permission, never touch with wet hands!`],
b_def:[`Мяу! Қазір ЖИ-ге қосыла алмай тұрмын, бірақ формулаларды 4-бөлімнен көр: U=U₁=U₂, I=I₁+I₂. Нақтырақ сұра: кернеу, ток, кедергі, амперметр… 🐾`,`Мяу! Сейчас не могу подключиться к ИИ, но посмотри формулы в разделе 4: U=U₁=U₂, I=I₁+I₂. Спроси точнее: напряжение, ток, сопротивление, амперметр… 🐾`,`Meow! I can't reach the AI right now, but look at the formulas in section 4: U=U₁=U₂, I=I₁+I₂. Ask more precisely: voltage, current, resistance, ammeter… 🐾`]
};
/* ===== Мәтіндердің түзетілген (нақты әрі түсінікті) нұсқасы: жоғарыдағы бірдей кілттерді ауыстырады ===== */
Object.assign(T,{
lab_how:[`<b>Қалай жұмыс істейді?</b><br>1) Құралды жоғарғы <u>сөреден</u> басып ұстап, төмендегі <u>партаға</u> сүйреп апар. Партадағы құралды қайта жылжытуға болады. Құралды сөреге қайтарсаң, ол партадан алынады.<br>2) Бір құралдың клеммасын (дөңгелек ұшын) бас, содан кейін екінші құралдың клеммасын бас – екеуінің арасында сым пайда болады. Сымды өшіру үшін оны бас.<br><b>Тапсырма:</b> ток көзі, кілт, амперметр және екі резистор бір тұйық тізбек құрсын: ток көзі → кілт → амперметр → резисторлар. Екі резисторды бір-біріне <u>параллель</u> жалғап, вольтметрді де олардың ұштарына <u>параллель</u> қос. Содан кейін <b>«Тізбекті тексеру»</b> батырмасын бас.`,`<b>Как это работает?</b><br>1) Нажми на прибор на верхней <u>полке</u>, удерживай и перетащи его на <u>парту</u> внизу. Прибор на парте можно передвигать. Если вернуть прибор на полку, он уберётся с парты.<br>2) Нажми на клемму (круглый контакт) одного прибора, затем на клемму другого – между ними появится провод. Чтобы убрать провод, нажми на него.<br><b>Задание:</b> источник тока, ключ, амперметр и два резистора должны образовать одну замкнутую цепь: источник → ключ → амперметр → резисторы. Соедини два резистора <u>параллельно</u> друг с другом, а вольтметр тоже подключи <u>параллельно</u> к их концам. Затем нажми <b>«Проверить цепь»</b>.`,`<b>How does it work?</b><br>1) Press and hold a device on the upper <u>shelf</u> and drag it onto the <u>desk</u> below. You can move a device on the desk. If you drag it back to the shelf, it is removed from the desk.<br>2) Click a terminal (round contact) of one device, then a terminal of another – a wire appears between them. Click a wire to delete it.<br><b>Task:</b> the power source, key, ammeter and two resistors must form one closed circuit: source → key → ammeter → resistors. Connect the two resistors <u>in parallel</u> with each other, and connect the voltmeter <u>in parallel</u> across their ends too. Then press <b>“Check the circuit”</b>.`],
s5_p:[`Өлшеу алдында шкаланың <b>бөлік құнын</b> білу керек. Бөлік құны: <b>c = (көрші екі санның айырмасы) ÷ (олардың арасындағы бөліктер саны)</b>. Төмендегі екі құралдың шкаласына қарап, тапсырманы орында:`,`Перед измерением нужно знать <b>цену деления</b> шкалы. Цена деления: <b>c = (разность двух соседних чисел) ÷ (число делений между ними)</b>. Посмотри на шкалы двух приборов ниже и выполни задание:`,`Before measuring you must know the <b>division value</b> of the scale. Division value: <b>c = (difference between two neighbouring numbers) ÷ (number of divisions between them)</b>. Look at the scales of the two meters below and do the task:`],
dv_this:[`Құрал түрі:`,`Тип прибора:`,`Type of meter:`],
dv_where:[`Шкала мен көрсеткішке қарап, үш мәнді тап.`,`Посмотри на шкалу и стрелку и найди три значения.`,`Look at the scale and the pointer and find three values.`],
e_short:[`⚡ Қысқа тұйықталу! Ток көзінің екі полюсі сыммен тікелей жалғанған. Ток көзін дереу ажырату керек!`,`⚡ Короткое замыкание! Два полюса источника соединены проводом напрямую. Источник нужно сразу отключить!`,`⚡ Short circuit! The two poles of the source are joined directly by a wire. The source must be disconnected at once!`],
e_amshort:[`❗ Амперметрдің екі клеммасы бір-бірімен тікелей жалғанған (қысқа тұйықталу), сондықтан ол өлшей алмайды.`,`❗ Две клеммы амперметра соединены друг с другом напрямую (короткое замыкание), поэтому он не может измерять.`,`❗ The two terminals of the ammeter are joined directly (short circuit), so it cannot measure.`],
e_rshort:[`❗ Резистордың екі клеммасы бір-бірімен тікелей жалғанған, ток резистор арқылы емес, сым арқылы өтеді.`,`❗ Две клеммы резистора соединены друг с другом напрямую, и ток идёт по проводу, а не через резистор.`,`❗ The two terminals of a resistor are joined directly, so the current flows through the wire and not through the resistor.`],
e_notpar:[`❗ Резисторлар параллель жалғанбаған. Екі резистордың бір ұштары ортақ бір түйінге, екінші ұштары ортақ екінші түйінге жалғануы керек.`,`❗ Резисторы соединены не параллельно. Одни концы двух резисторов должны быть присоединены к общему узлу, а другие концы – ко второму общему узлу.`,`❗ The resistors are not connected in parallel. One end of each resistor must go to a common node and the other end of each to a second common node.`],
e_main:[`❗ Негізгі тізбек дұрыс емес. Ток көзі, кілт, амперметр және резисторлар бір тұйық контурда бірінен соң бірі (тізбектей) жалғануы керек. Амперметрді резисторларға параллель қоспа.`,`❗ Основная цепь собрана неверно. Источник, ключ, амперметр и резисторы должны идти друг за другом (последовательно) в одном замкнутом контуре. Не подключай амперметр параллельно резисторам.`,`❗ The main circuit is wrong. The source, key, ammeter and resistors must follow one another (in series) in one closed loop. Do not connect the ammeter in parallel with the resistors.`],
s8_p:[`Ток көзінің кернеуін өзгертсең, әр тармақтағы ток I = U/R заңы бойынша өзгереді. Алдымен кестенің соңғы жолын толтыр (I = I₁ + I₂). Содан кейін графиктің торын басып, нүктелерді қой. Әр серияны (I₁, I₂ немесе I) бөлек таңдап сыз.`,`Если менять напряжение источника, ток в каждой ветви меняется по закону I = U/R. Сначала заполни последнюю строку таблицы (I = I₁ + I₂). Затем ставь точки, нажимая на клетки сетки графика. Каждую серию (I₁, I₂ или I) выбирай и строй отдельно.`,`If you change the source voltage, the current in each branch changes by I = U/R. First fill in the last row of the table (I = I₁ + I₂). Then place points by clicking the grid of the graph. Choose and draw each series (I₁, I₂ or I) separately.`],
s9_p:[`Үйдегі розеткаларға қосылған барлық құрал <b>параллель</b> жалғанған, желі кернеуі – 220 В. Төмендегі виртуалды үйде екі жалғау тәсілін салыстыр. Алдымен «Параллель» немесе «Тізбектей» батырмасын таңда, содан кейін шамды бас – ол күйіп кетеді. Қалған шамдар жанып тұра ма, жоқ па – бақыла!`,`Все приборы, включённые в домашние розетки, соединены <b>параллельно</b>, напряжение сети – 220 В. В виртуальном доме ниже сравни два способа соединения. Сначала выбери «Параллельно» или «Последовательно», затем нажми на лампу – она перегорит. Посмотри, продолжают ли гореть остальные лампы!`,`All appliances plugged into home sockets are connected <b>in parallel</b>, and the mains voltage is 220 V. In the virtual house below compare the two ways of connecting. First choose “In parallel” or “In series”, then click a bulb – it burns out. Watch whether the other bulbs keep shining!`],
l1_b:[`Электр шәйнек (2200 Вт) және шам (110 Вт) 220 В желіге параллель қосылған. Әр тармақтағы ток күшін I = P/U формуласымен тап, содан кейін оларды қос. <b>Жалпы ток күші қанша?</b>`,`Электрочайник (2200 Вт) и лампа (110 Вт) включены параллельно в сеть 220 В. Найди силу тока в каждой ветви по формуле I = P/U, затем сложи их. <b>Чему равна общая сила тока?</b>`,`An electric kettle (2200 W) and a lamp (110 W) are connected in parallel to a 220 V mains. Find the current in each branch with I = P/U, then add them. <b>What is the total current?</b>`],
l3_p:[`Автоматты сақтандырғыш ең көбі <b>16 А</b> токқа шыдайды. Құралдарды қосып, жалпы ток күшін <b>14–16 А</b> аралығына жеткіз. Ток 16 А-ден асса, автомат сөніп қалады. Әр құрал 220 В желіге параллель жалғанған.`,`Автоматический предохранитель выдерживает ток не более <b>16 А</b>. Включай приборы и доведи общий ток до <b>14–16 А</b>. Если ток превысит 16 А, автомат отключится. Каждый прибор подключён параллельно к сети 220 В.`,`The circuit breaker can carry at most <b>16 A</b>. Switch on appliances and bring the total current to <b>14–16 A</b>. If the current goes above 16 A, the breaker trips. Each appliance is connected in parallel to the 220 V mains.`],
b_gear:[`Барсик жасанды интеллектпен жауап беруі үшін Anthropic API кілтін енгіз (кілт тек осы браузерде сақталады). Кілт енгізбесең, Барсик өзінің ішкі жауаптарын береді.`,`Чтобы Барсик отвечал с помощью искусственного интеллекта, введи ключ Anthropic API (ключ хранится только в этом браузере). Без ключа Барсик отвечает встроенными подсказками.`,`To let Barsik answer with artificial intelligence, enter an Anthropic API key (it is stored only in this browser). Without a key Barsik gives built-in answers.`],
b_offline:[`Мяу! Жасанды интеллектке қосыла алмадым, сондықтан ішкі көмекші ретінде жауап беремін. Мұғалім ⚙️ белгісі арқылы API кілтін енгізсе, жауаптар толығырақ болады 🐾`,`Мяу! Не получилось подключиться к искусственному интеллекту, поэтому отвечаю как встроенный помощник. Если учитель введёт API-ключ через значок ⚙️, ответы станут подробнее 🐾`,`Meow! I could not connect to the AI, so I answer as a built-in helper. If the teacher enters an API key with the ⚙️ icon, my answers become fuller 🐾`],
bc1:[`Бөлік құны қалай табылады?`,`Как найти цену деления?`,`How do I find the division value?`],
bc2:[`Тізбекті қалай құраймын?`,`Как собрать цепь?`,`How do I build the circuit?`],
bc3:[`Жалпы кедергіні қалай есептеймін?`,`Как вычислить общее сопротивление?`,`How do I calculate the total resistance?`],
bc4:[`Неге үйде параллель қосады?`,`Почему дома соединяют параллельно?`,`Why is it parallel at home?`],
b_hello:[`Сәлем! Мен Барсикпін 🐾 Тізбек, формула немесе құрал туралы сұра – бірге шешеміз!`,`Привет! Я Барсик 🐾 Спрашивай про цепь, формулы или приборы – решим вместе!`,`Hi! I'm Barsik 🐾 Ask about the circuit, formulas or devices – we'll work it out together!`],
b_short:[`Қысқа тұйықталу – токтың кедергісі жоқ сым арқылы өтуі. Ток өте үлкен болып, құрал күйіп кетеді. Сондықтан ток көзінің екі полюсін сыммен тікелей жалғама, амперметрді тек тізбектей қос!`,`Короткое замыкание – это когда ток идёт по проводу почти без сопротивления. Ток становится очень большим, и прибор может сгореть. Поэтому не соединяй полюса источника проводом напрямую и включай амперметр только последовательно!`,`A short circuit is when current flows through a wire with almost no resistance. The current becomes huge and a device can burn out. So never join the poles of the source directly, and connect the ammeter only in series!`],
b_hyp:[`Гипотеза – тәжірибеге дейінгі болжам. Мысалы: «параллель жалғағанда кернеу бірдей, токтар қосылады, жалпы кедергі азаяды». Тәжірибеден кейін өлшеген сандарыңмен осыны тексересің.`,`Гипотеза – это предположение до опыта. Например: «при параллельном соединении напряжение одинаковое, токи складываются, общее сопротивление уменьшается». После опыта ты проверяешь это своими измерениями.`,`A hypothesis is a guess made before the experiment. For example: “in a parallel connection the voltage is the same, the currents add up and the total resistance decreases”. After the experiment you check it with your own measurements.`],
b_why:[`Үйде құралдарды параллель жалғайды. Себебі: 1) әр құралға бірдей 220 В түседі; 2) бір құрал сөнсе, қалғандары жұмыс істей береді. Виртуалды үйде «Тізбектей» батырмасын басып, шамды күйдіріп көр – не болатынын өзің көресің 🐾`,`Дома приборы соединяют параллельно. Причины: 1) на каждый прибор приходится одинаковые 220 В; 2) если один прибор выключится, остальные продолжают работать. В виртуальном доме выбери «Последовательно» и перегори лампу – сам увидишь, что будет 🐾`,`At home appliances are connected in parallel. Reasons: 1) each appliance gets the same 220 V; 2) if one appliance goes off, the others keep working. In the virtual house choose “In series” and burn out a bulb – you will see what happens 🐾`],
b_build:[`Тізбекті былай құра: 1) барлық құралды партаға сүйреп қой; 2) ток көзі → кілт → амперметр → екі резистор ретімен сым жалғап, тізбекті тұйықта; 3) екі резисторды бір-біріне параллель қос; 4) вольтметрді резисторлардың екі ұшына параллель қос; 5) «Тізбекті тексеру» батырмасын бас. Қолың жетпесе – ЕҚБ режимінен дайын сызбаны көр 🐾`,`Собери цепь так: 1) перетащи все приборы на парту; 2) соедини проводами по порядку: источник → ключ → амперметр → два резистора, замкни цепь; 3) соедини два резистора параллельно; 4) подключи вольтметр параллельно к концам резисторов; 5) нажми «Проверить цепь». Если трудно – включи режим ОВЗ и посмотри готовую схему 🐾`,`Build the circuit like this: 1) drag all devices onto the desk; 2) join them with wires in order: source → key → ammeter → two resistors, and close the loop; 3) connect the two resistors in parallel; 4) connect the voltmeter across the ends of the resistors; 5) press “Check the circuit”. If it is hard, switch on SEN mode and look at the ready scheme 🐾`],

function dialInner(max,maj,sub,unit){
  let s='<rect width="200" height="130" rx="8" fill="#f8f5ea"/>';const N=Math.round(max/maj*sub),cx=100,cy=122,r=88,P=a=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];

  for(let i=0;i<=N;i++){const a=(-55+110*i/N)*Math.PI/180,M=i%sub===0,r2=r-(M?14:7);
    s+=`<line x1="${cx+r*Math.sin(a)}" y1="${cy-r*Math.cos(a)}" x2="${cx+r2*Math.sin(a)}" y2="${cy-r2*Math.cos(a)}" stroke="#222" stroke-width="${M?2:1}"/>`;

  if(n==='3'){const t=tot();verify('l3','Ойын: құралдарды қосып ток күшін 14–16 А аралығына жеткізу (желі 220 В, сақтандырғыш 16 А).','Қосылғандар: '+([...on].map(i=>tr('ap'+i)).join(', ')||'жоқ')+'; жалпы ток '+t+' А',t>=14&&t<=16,tr('f_l3',F(t)))}
  if(n==='4'){const t=$('#l4').value.trim(),ok=(t.length>20&&/220|бірдей кернеу|кернеу бірдей|одинаков|same voltage|equal voltage/i.test(t))||/бірі.*(сөн|өш|істей)|тәуелсіз|независим|одно.*(выключ|перегор|погас)|one.*(off|burn|fail|break)|independent/i.test(t);verify('l4','Үй құралдары неге параллель жалғанады? (дұрыс: әр құралға бірдей 220 В түседі, бірі сөнсе басқалары жұмыс істей береді, әр құрал өз бетінше қосылады)',t||'(бос)',ok,tr('f_l4'))}});
/* ---------- test ---------- */
const TQ=[
{q:[`Параллель жалғауда әр өткізгіштің ұштарындағы кернеу…`,`При параллельном соединении напряжение на концах каждого проводника…`,`In a parallel connection the voltage across each conductor is…`],o:[[`бірдей`,`әртүрлі`,`қосылады`,`нөлге тең`],[`одинаково`,`разное`,`складывается`,`равно нулю`],[`the same`,`different`,`added up`,`zero`]],a:0},
{q:[`Параллель тізбектегі жалпы ток күші…`,`Общая сила тока в параллельной цепи…`,`The total current in a parallel circuit is…`],o:[[`I = I₁ = I₂`,`I = I₁ + I₂`,`I = I₁ · I₂`,`I = I₁ − I₂`],[`I = I₁ = I₂`,`I = I₁ + I₂`,`I = I₁ · I₂`,`I = I₁ − I₂`],[`I = I₁ = I₂`,`I = I₁ + I₂`,`I = I₁ · I₂`,`I = I₁ − I₂`]],a:1},
{q:[`R₁ = R₂ = 10 Ом өткізгіштер параллель жалғанса, жалпы кедергі…`,`Если R₁ = R₂ = 10 Ом соединены параллельно, общее сопротивление…`,`If R₁ = R₂ = 10 Ω are connected in parallel, the total resistance is…`],o:[[`20 Ом`,`10 Ом`,`5 Ом`,`100 Ом`],[`20 Ом`,`10 Ом`,`5 Ом`,`100 Ом`],[`20 Ω`,`10 Ω`,`5 Ω`,`100 Ω`]],a:2},
{q:[`Амперметр тізбекке қалай жалғанады?`,`Как амперметр включается в цепь?`,`How is an ammeter connected to the circuit?`],o:[[`параллель`,`тізбектей`,`екі жолмен де`,`жалғанбайды`],[`параллельно`,`последовательно`,`обоими способами`,`не подключается`],[`in parallel`,`in series`,`either way`,`not connected`]],a:1},
{q:[`Вольтметр өлшенетін өткізгішке қалай жалғанады?`,`Как вольтметр подключается к измеряемому проводнику?`,`How is a voltmeter connected to the conductor measured?`],o:[[`тізбектей`,`параллель`,`тек ток көзіне`,`тізбекке қарсы`],[`последовательно`,`параллельно`,`только к источнику`,`против цепи`],[`in series`,`in parallel`,`only to the source`,`against the circuit`]],a:1},
{q:[`R₁ = 6 Ом, R₂ = 3 Ом параллель. R = ?`,`R₁ = 6 Ом, R₂ = 3 Ом параллельно. R = ?`,`R₁ = 6 Ω, R₂ = 3 Ω in parallel. R = ?`],o:[[`9 Ом`,`4,5 Ом`,`2 Ом`,`18 Ом`],[`9 Ом`,`4,5 Ом`,`2 Ом`,`18 Ом`],[`9 Ω`,`4.5 Ω`,`2 Ω`,`18 Ω`]],a:2},
{q:[`Параллель тармақ санын көбейтсек, жалпы кедергі…`,`Если увеличить число параллельных ветвей, общее сопротивление…`,`If we add more parallel branches, the total resistance…`],o:[[`артады`,`азаяды`,`өзгермейді`,`шексіз болады`],[`растёт`,`уменьшается`,`не меняется`,`становится бесконечным`],[`increases`,`decreases`,`stays the same`,`becomes infinite`]],a:1},
{q:[`Шкаласы 0–3 А, 0 мен 1 арасында 5 бөлік. Бөлік құны?`,`Шкала 0–3 А, между 0 и 1 пять делений. Цена деления?`,`The scale is 0–3 A, with 5 divisions between 0 and 1. Division value?`],o:[[`0,1 А`,`0,2 А`,`0,5 А`,`1 А`],[`0,1 А`,`0,2 А`,`0,5 А`,`1 А`],[`0.1 A`,`0.2 A`,`0.5 A`,`1 A`]],a:1},
{q:[`Үйдегі розеткаға құралдар параллель қосылады, себебі…`,`Приборы в розетках дома включают параллельно, потому что…`,`Home appliances are connected in parallel because…`],o:[[`әрқайсысына бірдей 220 В түседі және біреуі сөнсе, басқасы жұмыс істей береді`,`ток аз жұмсалады`,`сымдар үнемделеді`,`кернеу бөлінеді`],[`на каждый приходится одинаковые 220 В, и если один выключен, остальные работают`,`тока тратится меньше`,`экономятся провода`,`напряжение делится`],[`each gets the same 220 V and if one is off the others keep working`,`less current is used`,`wires are saved`,`the voltage is divided`]],a:0}];
function buildTest(){const keep=TQ.map((q,i)=>{const v=document.querySelector(`input[name=t${i}]:checked`);return v?+v.value:-1});
  $('#test').innerHTML=TQ.map((q,i)=>`<div class="q${i>=5?' sen-hide':''}" id="q${i}"><b>${i+1}. ${q.q[li]}</b>${q.o[li].map((o,j)=>`<label><input type="radio" name="t${i}" value="${j}" ${keep[i]===j?'checked':''}> ${o}</label>`).join('')}</div>`).join('')}
$('#tsub').onclick=()=>{const N=senOn()?5:TQ.length;let sc=0,wr=[];TQ.slice(0,N).forEach((q,i)=>{const v=document.querySelector(`input[name=t${i}]:checked`),ok=v&&+v.value===q.a,el=$('#q'+i);el.classList.remove('ok','no');el.classList.add(ok?'ok':'no');ok?sc++:wr.push(`${i+1}-сұрақ: оқушы «${v?q.o[0][+v.value]:'жауап жоқ'}», дұрыс «${q.o[0][q.a]}»`)});
  verify('test',`Тест (${N} сұрақ). Қате жауаптар: ${wr.join('; ')||'жоқ'}.`,`${sc}/${N}`,sc>=Math.ceil(N*.7),tr('ts_fb',sc,N));$('#fb-test').insertAdjacentHTML('afterbegin',`<h3>${tr('ts_res',sc,N)} ${sc===N?'🏆':'⭐'}</h3>`)};
/* ---------- self-assessment + peer review + student ---------- */
function buildSA(){const st=JSON.parse(store.get('sa')||'[]');
  $('#sa').innerHTML=[1,2,3,4,5].map(i=>`<label class="chk"><input type="checkbox" data-sa="${i}" ${st.includes(i)?'checked':''}><span data-i="sa_${i}"></span></label>`).join('');
  $$('#sa input').forEach(c=>c.onchange=()=>{store.set('sa',JSON.stringify($$('#sa input:checked').map(x=>+x.dataset.sa)));updateSA()})}
function updateSA(){const n=$$('#sa input:checked').length;$('#sab').style.width=n*20+'%';$('#sac').textContent=tr('sa_cnt',n,5)+(n===5?' 🏆':'')}
['st1','st2','st3','pr1','pr2','pr3','pr4'].forEach(id=>{const e=$('#'+id);if(!e)return;const v=store.get('f_'+id);if(v)e.value=v;e.addEventListener('input',()=>store.set('f_'+id,e.value))});
if(!$('#st3').value){const d=new Date();$('#st3').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* ---------- toolbar: language, theme, SEN, print, speech ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function setTheme(t){document.documentElement.dataset.theme=t;store.set('th',t);$('#themeb').textContent=t==='dark'?'☀️':'🌙';$('#themeb').title=tr(t==='dark'?'tb_light':'tb_dark')}
$('#themeb').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function setSen(v){document.body.classList.toggle('sen',v);$('#senb').classList.toggle('on',v);store.set('sen',v?'1':'')}
$('#senb').onclick=()=>setSen(!senOn());
let _th=null;
window.addEventListener('beforeprint',()=>{_th=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light'});
window.addEventListener('afterprint',()=>{if(_th)document.documentElement.dataset.theme=_th});
$('#prb').onclick=()=>window.print();
$('#pdfb').onclick=()=>{toast(tr('tb_pdfh'));setTimeout(()=>window.print(),900)};
$$('[data-say]').forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('#'+b.dataset.say).innerText);u.lang=['kk-KZ','ru-RU','en-US'][li];speechSynthesis.speak(u)}catch(e){}});
$$('#langs button').forEach(b=>b.onclick=()=>setLang(+b.dataset.lg));
function setLang(i){li=i;store.set('lg',i);document.documentElement.lang=LC[i];document.title=tr('doc_t');
  $$('#langs button').forEach((b,j)=>b.classList.toggle('on',j===i));
  applyStatic();buildEq();buildTest();buildChips();drawLab();drawApps();drawSim();updateSA();keyTxt();
  $('#themeb').title=tr(document.documentElement.dataset.theme==='dark'?'tb_light':'tb_dark');
  if($('#uu').textContent)$('#uu').textContent=Us+' '+tr('u_V');drawG()}
/* ---------- Barsik ---------- */
const bm=$('#bm');let hist=[];
function say(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;bm.appendChild(d);bm.scrollTop=1e9;return d}
$('#bb').onclick=()=>{const p=$('#bp');p.style.display=p.style.display==='flex'?'none':'flex';$('#bsay').style.display=p.style.display==='flex'?'none':'block';if(!bm.children.length)say(tr('b_greet'),'b')};
$('#bx').onclick=()=>{$('#bp').style.display='none';$('#bsay').style.display='block'};
$('#gear').onclick=()=>{const k=prompt(tr('b_gear'),store.get('akey'));if(k!==null)store.set('akey',k.trim())};
let aiNote=false,busy=false;
async function ask(q){if(busy)return;busy=true;say(q,'u');hist.push({role:'user',content:q});const w=say('…','b');
  try{const t=await ai(SYS_B(),hist.slice(-8));w.textContent=t;hist.push({role:'assistant',content:t})}
  catch(err){hist.pop();w.textContent=local(q);if(!aiNote){aiNote=true;say(tr('b_offline'),'b')}}
  busy=false}
$('#bf').onsubmit=e=>{e.preventDefault();const q=$('#bi').value.trim();if(!q)return;$('#bi').value='';ask(q)};
function buildChips(){$('#bch').innerHTML=[1,2,3,4].map(i=>`<button type="button" data-q="bc${i}">${tr('bc'+i)}</button>`).join('');
  $$('#bch button').forEach(b=>b.onclick=()=>ask(tr(b.dataset.q)))}
/* ---------- start ---------- */
buildSA();mkDV(1);mkDV(2);
setTheme(store.get('th')==='dark'?'dark':'light');setSen(!!store.get('sen'));
setLang(li);
</script>
